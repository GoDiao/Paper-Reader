<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - Paper Reader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .config-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .config-header {
            margin-bottom: 2rem;
        }

        .config-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .config-header p {
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        .config-category {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .config-category-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .config-field {
            margin-bottom: 1.25rem;
        }

        .config-field:last-child {
            margin-bottom: 0;
        }

        .config-field-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .config-field-label .required {
            color: var(--error);
            margin-left: 0.25rem;
        }

        .config-field-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-surface-hover, #f4f4f5);
            color: var(--text-main);
            font-size: 0.875rem;
            transition: all var(--duration-short);
        }

        .config-field-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .config-field-input.has-value {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.05);
        }

        .config-field-description {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.375rem;
        }

        .config-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--duration-short);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-surface-active);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <a href="/" class="nav-link">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>

        <div class="config-header">
            <h1><i class="fas fa-cog"></i> Configuration</h1>
            <p>Override API keys and settings here. Base config is in .env (unchanged). Your overrides are saved to user_config.json and take effect immediately.</p>
        </div>

        <form id="configForm">
            <div id="configCategories"></div>

            <div class="config-actions">
                <button type="button" class="btn btn-secondary" id="resetBtn">
                    <i class="fas fa-undo"></i>
                    Reset Changes
                </button>
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save"></i>
                    Save Configuration
                </button>
            </div>
        </form>
    </div>

    <script>
        let currentConfig = {};
        let originalConfig = {};

        const translations = {
            en: {
                saving: 'Saving...',
                saved: 'Configuration saved successfully!',
                saveError: 'Failed to save configuration',
                loading: 'Loading configuration...',
                loadError: 'Failed to load configuration',
                required: '*',
                hasValue: 'Configured',
                noValue: 'Not configured'
            },
            zh: {
                saving: '保存中...',
                saved: '配置已保存！',
                saveError: '保存配置失败',
                loading: '加载配置中...',
                loadError: '加载配置失败',
                required: '*',
                hasValue: '已配置',
                noValue: '未配置'
            }
        };

        const FALLBACK_SCHEMA = {
            general: { title: 'General Settings', fields: [
                { key: 'DEEPSEEK_API_KEY', label: 'DeepSeek API Key', description: 'Default provider', placeholder: 'sk-...', is_secret: true, required: true },
                { key: 'OPENAI_API_KEY', label: 'OpenAI API Key', description: 'Alternative provider', placeholder: 'sk-...', is_secret: true },
                { key: 'SILICONFLOW_API_KEY', label: 'SiliconFlow API Key', description: 'Another provider', placeholder: 'sk-...', is_secret: true },
            ]},
            deep_research: { title: 'Deep Research', fields: [
                { key: 'TAVILY_API_KEY', label: 'Tavily API Key', description: 'For Tavily Deep Research', placeholder: 'tvly-...', is_secret: true },
                { key: 'VALYU_API_KEY', label: 'Valyu API Key', description: 'For Valyu Deep Research', placeholder: 'val_...', is_secret: true },
            ]},
        };

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = response.ok ? await response.json() : FALLBACK_SCHEMA;
                currentConfig = {};
                originalConfig = {};
                renderCategories(data);
            } catch (error) {
                console.error('Config load error:', error);
                showToast('Load failed, showing default form: ' + error.message, 'error');
                renderCategories(FALLBACK_SCHEMA);
            }
        }

        function renderCategories(data) {
            const container = document.getElementById('configCategories');
            container.innerHTML = '';
            if (!data || typeof data !== 'object') {
                container.innerHTML = '<p style="color: var(--text-secondary);">No configuration schema available.</p>';
                return;
            }

            for (const [category, schema] of Object.entries(data)) {
                if (!schema || !schema.fields || !Array.isArray(schema.fields)) continue;
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'config-category';
                
                const title = document.createElement('h2');
                title.className = 'config-category-title';
                title.textContent = schema.title;
                categoryDiv.appendChild(title);

                for (const field of schema.fields) {
                    const fieldDiv = document.createElement('div');
                    fieldDiv.className = 'config-field';

                    const label = document.createElement('label');
                    label.className = 'config-field-label';
                    label.textContent = field.label;
                    if (field.required) {
                        const req = document.createElement('span');
                        req.className = 'required';
                        req.textContent = ' *';
                        label.appendChild(req);
                    }
                    fieldDiv.appendChild(label);

                    const input = document.createElement('input');
                    input.type = field.is_secret ? 'password' : 'text';
                    input.className = 'config-field-input' + (field.has_value ? ' has-value' : '');
                    input.placeholder = field.placeholder || 'Enter value...';
                    input.dataset.key = field.key;
                    input.dataset.placeholder = field.placeholder || '';
                    input.value = field.is_secret ? '' : (field.value || '');
                    input.title = field.has_value ? translations.en.hasValue : translations.en.noValue;

                    fieldDiv.appendChild(input);

                    const desc = document.createElement('div');
                    desc.className = 'config-field-description';
                    desc.textContent = field.description;
                    fieldDiv.appendChild(desc);

                    categoryDiv.appendChild(fieldDiv);

                    // Store current config
                    currentConfig[field.key] = '';
                }

                container.appendChild(categoryDiv);
            }
        }

        async function saveConfig() {
            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            
            try {
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="loading-spinner"></span> ' + translations.en.saving;

                // Collect updated values
                const updates = {};
                const inputs = document.querySelectorAll('.config-field-input');
                inputs.forEach(input => {
                    const key = input.dataset.key;
                    const value = input.value.trim();
                    if (value) {
                        updates[key] = value;
                    }
                });

                if (Object.keys(updates).length === 0) {
                    showToast('No changes to save', 'error');
                    return;
                }

                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: updates })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Save failed');
                }

                const result = await response.json();
                showToast(`${translations.en.saved} (${result.count} keys updated)`, 'success');
                
                // Reload to refresh masked values
                await loadConfig();
            } catch (error) {
                showToast(translations.en.saveError + ': ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

        function resetForm() {
            document.getElementById('configForm').reset();
            const inputs = document.querySelectorAll('.config-field-input');
            inputs.forEach(input => {
                input.value = '';
                input.placeholder = input.dataset.placeholder || '';
                input.classList.remove('has-value');
            });
        }

        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();

            document.getElementById('configForm').addEventListener('submit', (e) => {
                e.preventDefault();
                saveConfig();
            });

            document.getElementById('resetBtn').addEventListener('click', resetForm);
        });
    </script>
</body>
</html>
